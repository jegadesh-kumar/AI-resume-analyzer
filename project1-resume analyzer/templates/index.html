<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Resume Analyzer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Inter',sans-serif;

            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            padding:40px;

            background: linear-gradient(
                135deg,
                #020617 0%,
                #172554 35%,
                #4c1d95 70%,
                #2563eb 100%
            );
        }

        .container{

            width:100%;
            max-width:900px;

            padding:50px;

            border-radius:30px;

            background:rgba(15,23,42,0.85);

            backdrop-filter:blur(20px);

            border:1px solid rgba(255,255,255,0.1);

            box-shadow:
            0 20px 40px rgba(0,0,0,0.4);

        }

        h1{
            font-size:4rem;
            font-weight:800;

            text-align:center;

            margin-bottom:10px;

            color:white;

            text-shadow:
            0 0 20px rgba(167,139,250,0.3);
        }

        .subtitle{

            text-align:center;

            color:rgba(255,255,255,0.7);

            margin-bottom:40px;

            font-size:1rem;
        }

        .form-group{
            margin-bottom:25px;
        }

        label{

            display:block;

            margin-bottom:10px;

            font-weight:600;

            color:white;
        }

        input[type="file"]{

            width:100%;

            padding:18px;

            border:none;

            border-radius:18px;

            background:#111827;

            color:white;

            font-family:'Inter',sans-serif;

            box-shadow:
            0 4px 15px rgba(0,0,0,0.3);
        }

        textarea{

            width:100%;

            min-height:250px;

            resize:vertical;

            border:none;

            border-radius:20px;

            padding:20px;

            background:#111827;

            color:white;

            font-size:16px;

            font-family:'Inter',sans-serif;

            box-shadow:
            0 4px 15px rgba(0,0,0,0.3);

            outline:none;
        }

        textarea::placeholder{
            color:#9ca3af;
        }

        textarea:focus{

            box-shadow:
            0 0 0 3px rgba(124,58,237,0.25),
            0 4px 15px rgba(0,0,0,0.3);
        }

        select{

            width:100%;

            padding:16px;

            border:none;

            border-radius:18px;

            background:#111827;

            color:white;

            font-size:15px;

            font-family:'Inter',sans-serif;

            outline:none;

            box-shadow:
            0 4px 15px rgba(0,0,0,0.3);
        }

        select:focus{

            box-shadow:
            0 0 0 3px rgba(124,58,237,0.25),
            0 4px 15px rgba(0,0,0,0.3);
        }

        .checkbox-group{

            display:flex;
            align-items:center;
            gap:12px;
        }

        .checkbox-group label{

            margin:0;
            color:white;
            cursor:pointer;
        }

        input[type="checkbox"]{

            width:18px;
            height:18px;

            cursor:pointer;
        }

        button{

            width:100%;

            border:none;

            border-radius:20px;

            padding:18px;

            font-size:18px;

            font-weight:700;

            cursor:pointer;

            color:white;

            background:linear-gradient(
                135deg,
                #7c3aed,
                #2563eb
            );

            transition:all 0.2s ease;
        }

        button:hover{

            transform:translateY(-2px);

            box-shadow:
            0 10px 25px rgba(124,58,237,0.4);
        }

        button:active{
            transform:translateY(0px);
        }

        @media(max-width:768px){

            .container{
                padding:30px;
            }

            h1{
                font-size:2.5rem;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <h1>AI Resume Analyzer</h1>

        <p class="subtitle">
            Upload your resume and compare it against a job description using AI
        </p>

        <form method="POST" action="/analyze" enctype="multipart/form-data">

            <div class="form-group">

                <label for="resume">
                    Upload Resume (PDF)
                </label>

                <input
                    type="file"
                    id="resume"
                    name="resume"
                    accept=".pdf"
                    required
                >

            </div>

            <div class="form-group">

                <div class="checkbox-group">

                    <input
                        type="checkbox"
                        id="generate_cover_letter"
                        name="generate_cover_letter"
                    >

                    <label for="generate_cover_letter">
                        Generate Cover Letter
                    </label>

                </div>

            </div>

            <div class="form-group">

                <label for="job_description">
                    Job Description
                </label>

                <textarea
                    id="job_description"
                    name="job_description"
                    placeholder="Paste the job description here..."
                    required
                ></textarea>

            </div>

            <div class="form-group">

                <label for="experience_level">
                    Experience Level
                </label>

                <select
                    id="experience_level"
                    name="experience_level"
                    required
                >
                    <option value="">
                        Select Experience Level
                    </option>

                    <option value="entry">
                        Entry Level
                    </option>

                    <option value="mid">
                        Mid Level
                    </option>

                    <option value="senior">
                        Senior Level
                    </option>

                </select>

            </div>

            <button type="submit">
                Analyze Resume
            </button>

        </form>

    </div>

</body>
</html>
